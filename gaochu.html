<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特种作业证信息 - 惠州动车所</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            overflow-x: scroll;
            scrollbar-width: thin;
        }
        .table-container table {
            min-width: 1200px;
        }
        .table-data {
            white-space: nowrap;
        }
        .text-red {
            color: #ff0000;
        }
        .export-btn {
            transition: all 0.2s ease;
        }
        .export-btn:hover {
            transform: scale(1.05);
        }
        .export-btn:active {
            transform: scale(0.95);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .token-modal-content {
            max-width: 400px;
            margin: 15% auto;
        }
        .error-message {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 6xl;
            border-radius: 0.375rem;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 页面结构与之前相同，保持不变 -->
    <!-- ... 之前的HTML结构 ... -->

    <script>
        // 配置GitHub仓库信息
        const GITHUB_CONFIG = {
            username: 'zhu1yun2',
            repo: 'fei',
            token: null,
            filePath: 'data.json'
        };

        // 构建GitHub API URL
        const GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/main/${GITHUB_CONFIG.filePath}`;
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;
        
        let pendingOperation = null;
        let isFetching = false;

        // 显示错误信息
        function showError(message) {
            const main = document.querySelector('main');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<strong>错误:</strong> ${message}`;
            if(main) main.prepend(errorDiv);
            else document.body.prepend(errorDiv);
            console.error(message);
            
            // 5秒后自动移除错误信息
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        // 显示加载状态
        function showLoading(show = true) {
            const refreshBtn = document.getElementById('refreshBtn');
            if (!refreshBtn) return;
            
            if (show) {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = `<i class="fa fa-refresh mr-2"></i><span class="loading-spinner"></span> 加载中`;
            } else {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = `<i class="fa fa-refresh mr-2"></i>刷新数据`;
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const tableBody = document.getElementById('certTableBody');
                if(!tableBody) throw new Error("页面缺少表格元素，请检查HTML结构");

                // 尝试从本地存储加载token
                const savedToken = localStorage.getItem('github_token');
                if(savedToken) {
                    GITHUB_CONFIG.token = savedToken;
                }
                
                await loadCertData();
                bindEvents();
                bindTokenEvents();
            } catch (error) {
                showError(`初始化失败: ${error.message}`);
            }
        });

        // 从GitHub获取数据（改进版本）
        async function fetchFromGitHub(retryCount = 3) {
            if (isFetching) return [];
            isFetching = true;
            showLoading(true);
            
            try {
                // 尝试从GitHub获取数据
                let response;
                let error;
                
                for (let i = 0; i < retryCount; i++) {
                    try {
                        // 添加随机参数避免缓存
                        response = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime(), {
                            cache: 'no-cache',
                            headers: {
                                'Accept': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            const text = await response.text();
                            if(!text.trim()) return [];
                            
                            try {
                                const data = JSON.parse(text);
                                isFetching = false;
                                showLoading(false);
                                return Array.isArray(data) ? data : [];
                            } catch(e) {
                                throw new Error(`JSON解析失败: ${e.message}`);
                            }
                        } else if (response.status === 404) {
                            isFetching = false;
                            showLoading(false);
                            return [];
                        } else {
                            error = new Error(`GitHub请求失败: ${response.status}`);
                            // 如果遇到速率限制，等待一段时间再重试
                            if (response.status === 403) {
                                const resetTime = response.headers.get('X-RateLimit-Reset');
                                if (resetTime) {
                                    const waitTime = Math.max(0, (parseInt(resetTime) * 1000) - Date.now()) + 1000;
                                    console.log(`遇到速率限制，等待 ${waitTime/1000} 秒后重试`);
                                    await new Promise(resolve => setTimeout(resolve, waitTime));
                                }
                            }
                        }
                    } catch (err) {
                        error = err;
                        // 如果不是最后一次尝试，等待一段时间再重试
                        if (i < retryCount - 1) {
                            await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                        }
                    }
                }
                
                isFetching = false;
                showLoading(false);
                throw error || new Error('未知错误');
            } catch (error) {
                isFetching = false;
                showLoading(false);
                console.error('从GitHub加载数据失败:', error);
                throw error;
            }
        }

        // 保存数据到GitHub（改进版本）
        async function saveToGitHub(data) {
            if (!GITHUB_CONFIG.token) {
                throw new Error('需要授权才能保存数据，请输入GitHub访问令牌');
            }
            
            showLoading(true);
            
            try {
                let sha = null;
                // 尝试获取文件SHA
                try {
                    const fileInfo = await fetch(GITHUB_API_URL, {
                        headers: {
                            'Authorization': `token ${GITHUB_CONFIG.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (fileInfo.ok) {
                        const fileData = await fileInfo.json();
                        sha = fileData.sha;
                    } else if (fileInfo.status !== 404) {
                        const err = await fileInfo.json();
                        throw new Error(`获取文件信息失败: ${fileInfo.status} - ${err.message || '令牌权限不足'}`);
                    }
                } catch (e) {
                    console.log("首次创建文件或获取SHA失败", e);
                }

                // 准备数据
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
                
                // 发送更新请求
                const response = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `更新高处作业证数据 - ${new Date().toLocaleString()}`,
                        content: content,
                        sha: sha
                    })
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(`GitHub保存失败: ${response.status} - ${err.message || '令牌权限不足'}`);
                }
                
                showLoading(false);
                return true;
            } catch (error) {
                showLoading(false);
                console.error('保存到GitHub失败:', error);
                throw error;
            }
        }

        // 加载证书数据（改进版本）
        async function loadCertData(filterText = '') {
            try {
                const tableBody = document.getElementById('certTableBody');
                tableBody.innerHTML = '<tr><td colspan="16" class="px-4 py-3 text-center text-sm text-gray-500"><span class="loading-spinner"></span> 加载数据中...</td></tr>';
                
                const data = await fetchFromGitHub();
                
                tableBody.innerHTML = '';
                
                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="16" class="px-4 py-3 text-center text-sm text-gray-500">暂无数据，首次使用需要授权初始化数据</td></tr>`;
                    const defaultData = getDefaultData();
                    openTokenModal(async () => {
                        await saveToGitHub(defaultData);
                        await loadCertData(filterText);
                    });
                    return;
                }
                
                // 过滤数据
                const filteredData = data.filter(cert => {
                    if (!filterText) return true;
                    const searchText = filterText.toLowerCase();
                    return (
                        (cert.employeeId && cert.employeeId.toLowerCase().includes(searchText)) ||
                        (cert.employeeName && cert.employeeName.toLowerCase().includes(searchText)) ||
                        (cert.certNumber && cert.certNumber.toLowerCase().includes(searchText))
                    );
                });
                
                // 填充表格
                if (filteredData.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="16" class="px-4 py-3 text-center text-sm text-gray-500">没有找到匹配的记录</td></tr>`;
                    return;
                }
                
                filteredData.forEach((cert, index) => {
                    const row = document.createElement('tr');
                    const textClass = cert.isRed ? 'text-red' : 'text-gray-900';
                    
                    // 格式化日期显示
                    const formatDate = (dateStr) => {
                        if (!dateStr) return '';
                        // 尝试解析不同格式的日期
                        const date = new Date(dateStr);
                        if (isNaN(date.getTime())) return dateStr; // 如果无法解析，返回原始字符串
                        return date.toISOString().split('T')[0]; // 格式化为YYYY-MM-DD
                    };
                    
                    row.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${index + 1}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.employeeId || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.employeeName || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.organization || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.workshop || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.line || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.certName || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.issuingAuthority || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.certNumber || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.initialDate)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.validUntil)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.reviewDate)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.workType || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.operationItem || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.actualReviewDate)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900 table-data">
                            <button class="edit-btn mr-2 text-blue-600 hover:text-blue-800" data-id="${cert.id}">
                                <i class="fa fa-edit"></i>
                            </button>
                            <button class="delete-btn text-red-600 hover:text-red-800" data-id="${cert.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
                
                bindEditDeleteEvents();
            } catch (error) {
                showError('加载数据失败: ' + error.message);
            }
        }

        // 其他函数保持不变...
        // ... 包括 getDefaultData(), bindEvents(), bindTokenEvents(), openTokenModal(), 
        // closeTokenModal(), handleConfirmToken(), bindEditDeleteEvents(), openModal(), 
        // closeModal(), saveCert(), deleteCert(), exportToExcel() 等函数 ...
        
    </script>
</body>
</html>
