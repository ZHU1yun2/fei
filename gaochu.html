    <script>
        // GitHub 配置
        const GITHUB_CONFIG = {
            username: 'ZHU1yun2',
            repo: 'fei',
            token: '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',
            filePath: 'data.json'
        };
        
        // 获取GitHub数据URL
        const GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/main/${GITHUB_CONFIG.filePath}`;
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;

        // 初始化数据
        document.addEventListener('DOMContentLoaded', async function() {
            await loadCertData();
            bindEvents();
        });

        // 从GitHub加载数据
        async function fetchFromGitHub() {
            try {
                const response = await fetch(GITHUB_RAW_URL);
                if (!response.ok) {
                    if (response.status === 404) {
                        return [];
                    }
                    throw new Error(`GitHub请求失败: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('从GitHub加载数据失败:', error);
                return JSON.parse(localStorage.getItem('certData')) || [];
            }
        }

        // 保存数据到GitHub
        async function saveToGitHub(data) {
            try {
                let sha = null;
                try {
                    const fileInfo = await fetch(GITHUB_API_URL, {
                        headers: {
                            'Authorization': `token ${GITHUB_CONFIG.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }).then(res => res.json());
                    sha = fileInfo.sha;
                } catch (e) {}
                
                const response = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `更新高处作业证数据 - ${new Date().toLocaleString()}`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                        sha: sha
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`GitHub保存失败: ${response.status}`);
                }
                
                localStorage.setItem('certData', JSON.stringify(data));
                return true;
            } catch (error) {
                console.error('保存到GitHub失败:', error);
                localStorage.setItem('certData', JSON.stringify(data));
                alert('数据已保存到本地，但GitHub同步失败: ' + error.message);
                return false;
            }
        }

        // 加载证书数据到表格
        async function loadCertData(filterText = '') {
            try {
                const data = await fetchFromGitHub();
                const tableBody = document.getElementById('certTableBody');
                tableBody.innerHTML = '';
                
                if (data.length === 0) {
                    const defaultData = getDefaultData();
                    await saveToGitHub(defaultData);
                    return loadCertData(filterText);
                }
                
                const filteredData = data.filter(cert => {
                    if (!filterText) return true;
                    const searchText = filterText.toLowerCase();
                    return (
                        cert.employeeId.toLowerCase().includes(searchText) ||
                        cert.employeeName.toLowerCase().includes(searchText) ||
                        (cert.certNumber && cert.certNumber.toLowerCase().includes(searchText))
                    );
                });
                
                filteredData.forEach((cert, index) => {
                    const row = document.createElement('tr');
                    const textClass = cert.isRed ? 'text-red' : 'text-gray-900';
                    
                    row.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${index + 1}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.employeeId}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.employeeName}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.organization}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.workshop}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.line}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.certName}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.issuingAuthority}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.certNumber}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.initialDate}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.validUntil}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.reviewDate}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.workType}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.operationItem}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.actualReviewDate}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900 table-data">
                            <button class="edit-btn mr-2 text-blue-600 hover:text-blue-800" data-id="${cert.id}">
                                <i class="fa fa-edit"></i>
                            </button>
                            <button class="delete-btn text-red-600 hover:text-red-800" data-id="${cert.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
                
                bindEditDeleteEvents();
                
            } catch (error) {
                console.error('加载数据失败:', error);
                alert('加载数据失败: ' + error.message);
            }
        }

        function getDefaultData() {
            return [
                {
                    id: 1,
                    employeeId: '150889',
                    employeeName: '黄博',
                    organization: '列车检修服务中心',

                    organization: '列车检修服务中心',
                    workshop: '惠州动车所',
                    line: '莞惠线',
                    certName: '特种作业操作证',
                    issuingAuthority: '广州市应急管理局',
                    certNumber: 'T44142419920316255X',
                    initialDate: '2024/12/16',
                    validUntil: '2030/12/15',
                    reviewDate: '2027/12/16',
                    workType: '高处作业',
                    operationItem: '高处安装、维护、拆除',
                    actualReviewDate: '',
                    isRed: false
                },
                {
                    id: 3,

                    certName: '特种作业操作证',

                    certNumber: 'T441623199610082017',
                    initialDate: '2020/1/9',
                    validUntil: '2029/4/16',
                    reviewDate: '2026/4/16',
                    workType: '高处作业',

                }
            ];
        }

        // 绑定事件
        function bindEvents() {
            document.getElementById('addBtn').addEventListener('click', function() {
                openModal('add');
            });
            
            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadCertData();
                document.getElementById('searchInput').value = '';
            });
            
            document.getElementById('searchBtn').addEventListener('click', function() {
                const searchText = document.getElementById('searchInput').value.trim();
                loadCertData(searchText);
            });
            
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchText = this.value.trim();
                    loadCertData(searchText);
                }
            });
            
            document.getElementById('exportExcel').addEventListener('click', exportToExcel);
            
            document.querySelector('.close').addEventListener('click', closeModal);
            document.querySelector('.closeModal').addEventListener('click', closeModal);
            
            document.getElementById('certForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await saveCert();
            });
        }

        // 绑定编辑和删除按钮事件
        function bindEditDeleteEvents() {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    openModal('edit', id);
                });
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    if (confirm('确定要删除这条记录吗？')) {
                        deleteCert(id);
                    }
                });
            });
        }

        // 打开模态框
        async function openModal(mode, id = null) {
            const modal = document.getElementById('certModal');
            const form = document.getElementById('certForm');
            const title = document.getElementById('modalTitle');
            
            if (mode === 'add') {
                title.textContent = '添加新证书';
                form.reset();
                document.getElementById('certId').value = '';
            } else if (mode === 'edit' && id) {
                title.textContent = '编辑证书信息';
                const data = await fetchFromGitHub();
                const cert = data.find(item => item.id === id);
                if (cert) {
                    Object.keys(cert).forEach(key => {
                        const field = document.getElementById(key);
                        if (field) {
                            if (field.type === 'checkbox') {
                                field.checked = cert[key];
                            } else {
                                field.value = cert[key] || '';
                            }
                        }
                    });
                    document.getElementById('certId').value = id;
                }
            }
            
            modal.style.display = 'block';
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('certModal').style.display = 'none';
        }

        // 保存证书
        async function saveCert() {
            try {
                const form = document.getElementById('certForm');
                const id = document.getElementById('certId').value;
                const isRed = document.getElementById('isRed').checked;
                
                const certData = {
                    employeeId: document.getElementById('employeeId').value,
                    employeeName: document.getElementById('employeeName').value,
                    organization: document.getElementById('organization').value,
                    workshop: document.getElementById('workshop').value,
                    line: document.getElementById('line').value,
                    certName: document.getElementById('certName').value,
                    issuingAuthority: document.getElementById('issuingAuthority').value,
                    certNumber: document.getElementById('certNumber').value,
                    initialDate: document.getElementById('initialDate').value,
                    validUntil: document.getElementById('validUntil').value,
                    reviewDate: document.getElementById('reviewDate').value,
                    workType: document.getElementById('workType').value,
                    operationItem: document.getElementById('operationItem').value,
                    actualReviewDate: document.getElementById('actualReviewDate').value,
                    isRed: isRed
                };
                
                let data = await fetchFromGitHub();
                
                if (id) {
                    const index = data.findIndex(item => item.id === parseInt(id));
                    if (index !== -1) {
                        data[index] = { ...data[index], ...certData };
                    }
                } else {
                    const newId = data.length > 0 ? Math.max(...data.map(item => item.id)) + 1 : 1;
                    data.push({ id: newId, ...certData });
                }
                
                await saveToGitHub(data);
                await loadCertData();
                closeModal();
                
            } catch (error) {
                console.error('保存证书失败:', error);
                alert('保存失败: ' + error.message);
            }
        }

        // 删除证书
        async function deleteCert(id) {
            try {
                let data = await fetchFromGitHub();
                data = data.filter(item => item.id !== id);
                await saveToGitHub(data);
                await loadCertData();
            } catch (error) {
                console.error('删除证书失败:', error);
                alert('删除失败: ' + error.message);
            }
        }

        // 导出为Excel（中文列名）
        async function exportToExcel() {
            try {
                const data = await fetchFromGitHub();
                if (data.length === 0) {
                    alert('没有可导出的数据');
                    return;
                }
                
                // 处理数据并映射中文列名
                const processedData = data.map(item => {
                    const newItem = {};
                    // 定义中英文字段映射
                    const fieldMap = {
                        employeeId: '员工编号',
                        employeeName: '员工姓名',
                        organization: '组织',
                        workshop: '中心站/车间',
                        line: '所属线路',
                        certName: '证书名称',
                        issuingAuthority: '发证机关',
                        certNumber: '证书编号',
                        initialDate: '初次领证日期',
                        validUntil: '有效期',
                        reviewDate: '应复审日期',
                        workType: '作业类别',
                        operationItem: '操作项目',
                        actualReviewDate: '实际复审日期'
                    };
                    
                    // 转换字段名
                    Object.keys(fieldMap).forEach(key => {
                        newItem[fieldMap[key]] = item[key] || '';
                    });
                    
                    return newItem;
                });
                
                // 创建工作簿
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(processedData);
                
                // 设置列宽
                ws['!cols'] = [
                    {wch: 10}, {wch: 15}, {wch: 10}, 
                    {wch: 20}, {wch: 15}, {wch: 10},
                    {wch: 20}, {wch: 20}, {wch: 25},
                    {wch: 15}, {wch: 15}, {wch: 15},
                    {wch: 15}, {wch: 25}
                ];
                
                XLSX.utils.book_append_sheet(wb, ws, "高处作业证数据");
                
                // 导出文件
                XLSX.writeFile(wb, `高处作业证_${new Date().toLocaleDateString()}.xlsx`);
                
            } catch (error) {
                console.error('导出Excel失败:', error);
                alert('导出失败: ' + error.message);
            }
        }
    </script>
</body>
</html>
