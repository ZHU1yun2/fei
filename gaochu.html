<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 保持原有的 head 部分不变 -->
    <!-- ... -->
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 保持原有的 HTML 结构不变 -->
    <!-- ... -->

    <script>
        // GitHub 配置 - 移除了硬编码的 token
        const GITHUB_CONFIG = {
            username: 'zhu1yun2',
            repo: 'fei',
            filePath: 'data.json'
        };

        // 获取GitHub数据URL
        const GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/main/${GITHUB_CONFIG.filePath}`;
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;

        // 存储 GitHub Token
        let GITHUB_TOKEN = localStorage.getItem('github_token') || '';

        // 初始化数据
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查是否有保存的 token
            if (!GITHUB_TOKEN) {
                await promptForToken();
            }
            
            try {
                await loadCertData();
                bindEvents();
            } catch (error) {
                console.error('初始化失败:', error);
                if (error.message.includes('401')) {
                    alert('GitHub 认证失败，请重新输入有效的 Token');
                    await promptForToken();
                    await loadCertData();
                    bindEvents();
                }
            }
        });

        // 提示用户输入 GitHub Token
        async function promptForToken() {
            const token = prompt('请输入 GitHub 个人访问 Token (需要 repo 权限):');
            if (token) {
                GITHUB_TOKEN = token;
                localStorage.setItem('github_token', token);
                return true;
            }
            throw new Error('未提供 GitHub Token');
        }

        // 从GitHub加载数据
        async function fetchFromGitHub() {
            try {
                const response = await fetch(GITHUB_RAW_URL);
                if (!response.ok) {
                    if (response.status === 404) {
                        return [];
                    }
                    throw new Error(`GitHub请求失败: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('从GitHub加载数据失败:', error);
                return JSON.parse(localStorage.getItem('certData')) || [];
            }
        }

        // 保存数据到GitHub
        async function saveToGitHub(data) {
            if (!GITHUB_TOKEN) {
                await promptForToken();
            }
            
            try {
                let sha = null;
                try {
                    const fileInfo = await fetch(GITHUB_API_URL, {
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }).then(res => res.json());
                    sha = fileInfo.sha;
                } catch (e) {
                    console.log('获取文件SHA失败，可能是第一次创建文件');
                }

                const response = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `更新高处作业证数据 - ${new Date().toLocaleString()}`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                        sha: sha
                    })
                });

                if (!response.ok) {
                    // 如果 token 无效，清除保存的 token
                    if (response.status === 401) {
                        localStorage.removeItem('github_token');
                        GITHUB_TOKEN = '';
                    }
                    throw new Error(`GitHub保存失败: ${response.status}`);
                }

                localStorage.setItem('certData', JSON.stringify(data));
                return true;
            } catch (error) {
                console.error('保存到GitHub失败:', error);
                localStorage.setItem('certData', JSON.stringify(data));
                alert('数据已保存到本地，但GitHub同步失败: ' + error.message);
                return false;
            }
        }

        // 其余函数保持不变...
        // 保持原有的 loadCertData, getDefaultData, bindEvents 等函数不变
        // ...

    </script>
</body>
</html>
