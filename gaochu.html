<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 头部内容保持不变，与原始代码一致 -->
    <!-- ... -->
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 添加GitHub令牌输入模态框 -->
    <div id="tokenModal" class="modal" style="display: block;">
        <div class="modal-content">
            <h2 class="text-xl font-bold mb-4">请输入GitHub访问令牌</h2>
            <div class="mb-4">
                <label for="githubTokenInput" class="block text-sm font-medium text-gray-700">GitHub个人访问令牌</label>
                <input type="password" id="githubTokenInput" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="输入您的GitHub访问令牌">
                <p class="mt-2 text-sm text-gray-500">令牌需要repo权限，用于读写仓库数据</p>
            </div>
            <div class="flex justify-end space-x-4">
                <button id="saveTokenBtn" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                    保存
                </button>
            </div>
        </div>
    </div>

    <!-- 原有页面内容保持不变 -->
    <!-- ... -->

    <script>
        // GitHub 配置
        const GITHUB_CONFIG = {
            username: 'zhu1yun2',
            repo: 'fei',
            filePath: 'data.json',
            token: null // 将从用户输入获取
        };

        // 获取GitHub数据URL
        let GITHUB_RAW_URL = '';
        let GITHUB_API_URL = '';

        // 初始化数据
        document.addEventListener('DOMContentLoaded', function() {
            // 绑定令牌保存按钮事件
            document.getElementById('saveTokenBtn').addEventListener('click', async function() {
                const token = document.getElementById('githubTokenInput').value.trim();
                if (!token) {
                    alert('请输入有效的GitHub访问令牌');
                    return;
                }
                
                GITHUB_CONFIG.token = token;
                GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/main/${GITHUB_CONFIG.filePath}`;
                GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;
                
                document.getElementById('tokenModal').style.display = 'none';
                
                try {
                    await loadCertData();
                    bindEvents();
                } catch (error) {
                    console.error('初始化失败:', error);
                    alert('初始化失败: ' + error.message);
                    document.getElementById('tokenModal').style.display = 'block';
                }
            });
        });

        // 从GitHub加载数据
        async function fetchFromGitHub() {
            if (!GITHUB_CONFIG.token) {
                throw new Error('未设置GitHub访问令牌');
            }
            
            try {
                const response = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime());
                if (!response.ok) {
                    if (response.status === 404) {
                        return [];
                    }
                    throw new Error(`GitHub请求失败: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('从GitHub加载数据失败:', error);
                throw error;
            }
        }

        // 保存数据到GitHub
        async function saveToGitHub(data) {
            if (!GITHUB_CONFIG.token) {
                throw new Error('未设置GitHub访问令牌');
            }
            
            try {
                let sha = null;
                try {
                    const fileInfo = await fetch(GITHUB_API_URL, {
                        headers: {
                            'Authorization': `token ${GITHUB_CONFIG.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }).then(res => res.json());
                    sha = fileInfo.sha;
                } catch (e) {
                    console.log('首次创建文件，没有sha值');
                }
                
                const response = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `更新高处作业证数据 - ${new Date().toLocaleString()}`,
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                        sha: sha
                    })
                });

                if (!response.ok) {
                    throw new Error(`GitHub保存失败: ${response.status}`);
                }
                
                return true;
            } catch (error) {
                console.error('保存到GitHub失败:', error);
                throw error;
            }
        }

        // 其余函数保持不变，与原始代码一致
        // loadCertData, getDefaultData, bindEvents, bindEditDeleteEvents, 
        // openModal, closeModal, saveCert, deleteCert, exportToExcel
        // ... 
    </script>
</body>
</html>
