<!DOCTYPE html>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            overflow-x: scroll;
            scrollbar-width: thin;
        }
        .table-container table {
            min-width: 1200px;
        }
        .table-data {
            white-space: nowrap;
        }
        .text-red {
            color: #ff0000;
        }
        .export-btn {
            transition: all 0.2s ease;
        }
        .export-btn:hover {
            transform: scale(1.05);
        }
        .export-btn:active {
            transform: scale(0.95);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            max-width: 500px;
            border-radius: 8px;
            max-height: 80vh;

        .token-modal-content {

            margin: 15% auto;

            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 6xl;
            border-radius: 0.375rem;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

    <script>
        // 配置GitHub仓库信息
        const GITHUB_CONFIG = {
            username: 'zhu1yun2',
            repo: 'fei',
            token: null,
            filePath: 'data.json'
        };

        // 构建GitHub API URL
        const GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/main/${GITHUB_CONFIG.filePath}`;
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;

        let pendingOperation = null;
        let isFetching = false;

        // 显示错误信息
        function showError(message) {
            const main = document.querySelector('main');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<strong>错误:</strong> ${message}`;
            if(main) main.prepend(errorDiv);
            else document.body.prepend(errorDiv);
            console.error(message);
            
            // 5秒后自动移除错误信息
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        // 显示加载状态
        function showLoading(show = true) {
            const refreshBtn = document.getElementById('refreshBtn');
            if (!refreshBtn) return;
            
            if (show) {
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = `<i class="fa fa-refresh mr-2"></i><span class="loading-spinner"></span> 加载中`;
            } else {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = `<i class="fa fa-refresh mr-2"></i>刷新数据`;
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // 确保所有DOM元素都已加载
                await new Promise(resolve => setTimeout(resolve, 100));
                
                const tableBody = document.getElementById('certTableBody');
                if(!tableBody) throw new Error("页面缺少表格元素，请检查HTML结构");
                
                // 尝试从本地存储加载token
                const savedToken = localStorage.getItem('github_token');
                if(savedToken) {
                    GITHUB_CONFIG.token = savedToken;
                }
                
                await loadCertData();
                bindEvents();
                bindTokenEvents();
            } catch (error) {
                showError(`初始化失败: ${error.message}`);
            }
        });

        // 绑定事件
        function bindEvents() {
            // 绑定搜索按钮事件
            document.getElementById('searchBtn').addEventListener('click', function() {
                const searchText = document.getElementById('searchInput').value.trim();
                loadCertData(searchText);
            });
            
            // 绑定搜索输入框回车事件
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchText = this.value.trim();
                    loadCertData(searchText);
                }
            });
            
            // 绑定刷新按钮事件
            document.getElementById('refreshBtn').addEventListener('click', function() {
                const searchText = document.getElementById('searchInput').value.trim();
                loadCertData(searchText);
            });
            
            // 绑定添加按钮事件
            document.getElementById('addBtn').addEventListener('click', function() {
                openCertModal();
            });
            
            // 绑定导出Excel按钮事件
            document.getElementById('exportExcel').addEventListener('click', exportToExcel);
            
            // 绑定模态框关闭事件
            document.querySelectorAll('.close, .closeModal').forEach(btn => {
                btn.addEventListener('click', closeCertModal);
            });
            
            // 绑定表单提交事件
            document.getElementById('certForm').addEventListener('submit', handleFormSubmit);
        }

        // 绑定令牌相关事件
        function bindTokenEvents() {
            document.querySelectorAll('.close, .closeTokenModal').forEach(btn => {
                btn.addEventListener('click', closeTokenModal);
            });
            
            document.getElementById('confirmTokenBtn').addEventListener('click', handleConfirmToken);
        }

        // 打开令牌模态框
        function openTokenModal(callback) {
            pendingOperation = callback;
            document.getElementById('tokenModal').style.display = 'block';
        }

        // 关闭令牌模态框
        function closeTokenModal() {
            document.getElementById('tokenModal').style.display = 'none';
            pendingOperation = null;
            document.getElementById('githubTokenInput').value = '';
        }

        // 处理令牌确认
        async function handleConfirmToken() {
            const token = document.getElementById('githubTokenInput').value.trim();
            if (!token) {
                alert('请输入有效的GitHub访问令牌');
                return;
            }
            
            // 验证令牌有效性
            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `token ${token}`
                    }
                });
                
                if (!response.ok) {
                    // 尝试获取更详细的错误信息
                    let errorMsg = '令牌无效或权限不足';
                    try {
                        const errorData = await response.json();
                        if(errorData.message) {
                            errorMsg = errorData.message;
                        }
                    } catch(e) {
                        console.log('无法解析错误响应');
                    }
                    throw new Error(errorMsg);
                }
                
                // 保存token到本地存储
                localStorage.setItem('github_token', token);
                GITHUB_CONFIG.token = token;
                closeTokenModal();
                
                if (pendingOperation && typeof pendingOperation === 'function') {
                    try {
                        await pendingOperation();
                    } catch (error) {
                        showError(`操作失败: ${error.message}`);
                    }
                }
            } catch (error) {
                showError(`令牌验证失败: ${error.message}`);
            }
        }

        // 从GitHub获取数据（改进版本）
        async function fetchFromGitHub(retryCount = 3) {
            if (isFetching) return [];
            isFetching = true;
            showLoading(true);
            
            try {
                // 尝试从GitHub获取数据
                let response;
                let error;
                
                for (let i = 0; i < retryCount; i++) {
                    try {
                        // 添加随机参数避免缓存
                        response = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime(), {
                            cache: 'no-cache',
                            headers: {
                                'Accept': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            const text = await response.text();
                            if(!text.trim()) return [];
                            
                            try {
                                const data = JSON.parse(text);
                                isFetching = false;
                                showLoading(false);
                                return Array.isArray(data) ? data : [];
                            } catch(e) {
                                throw new Error(`JSON解析失败: ${e.message}`);
                            }
                        } else if (response.status === 404) {
                            isFetching = false;
                            showLoading(false);
                            return [];
                        } else {
                            error = new Error(`GitHub请求失败: ${response.status}`);
                            // 如果遇到速率限制，等待一段时间再重试
                            if (response.status === 403) {
                                const resetTime = response.headers.get('X-RateLimit-Reset');
                                if (resetTime) {
                                    const waitTime = Math.max(0, (parseInt(resetTime) * 1000) - Date.now()) + 1000;
                                    console.log(`遇到速率限制，等待 ${waitTime/1000} 秒后重试`);
                                    await new Promise(resolve => setTimeout(resolve, waitTime));
                                }
                            }
                        }
                    } catch (err) {
                        error = err;
                        // 如果不是最后一次尝试，等待一段时间再重试
                        if (i < retryCount - 1) {
                            await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                        }
                    }
                }
                
                isFetching = false;
                showLoading(false);
                throw error || new Error('未知错误');
            } catch (error) {
                isFetching = false;
                showLoading(false);
                console.error('从GitHub加载数据失败:', error);
                throw error;
            }
        }

        // 保存数据到GitHub（改进版本）
        async function saveToGitHub(data) {
            if (!GITHUB_CONFIG.token) {
                throw new Error('需要授权才能保存数据，请输入GitHub访问令牌');
            }
            
            showLoading(true);
            
            try {
                let sha = null;
                
                // 尝试获取文件SHA
                try {
                    const fileInfo = await fetch(GITHUB_API_URL, {
                        headers: {
                            'Authorization': `token ${GITHUB_CONFIG.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (fileInfo.ok) {
                        const fileData = await fileInfo.json();
                        sha = fileData.sha;
                    } else if (fileInfo.status !== 404) {
                        const err = await fileInfo.json();
                        throw new Error(`获取文件信息失败: ${fileInfo.status} - ${err.message || '令牌权限不足'}`);
                    }
                } catch (e) {
                    console.log("首次创建文件或获取SHA失败", e);
                }
                
                // 准备数据
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
                
                // 发送更新请求 - 修改了认证头格式
                const response = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`, // 修改为使用token而不是Bearer
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `更新高处作业证数据 - ${new Date().toLocaleString()}`,
                        content: content,
                        sha: sha
                    })
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(`GitHub保存失败: ${response.status} - ${err.message || '令牌权限不足'}`);
                }
                
                showLoading(false);
                return true;
            } catch (error) {
                showLoading(false);
                console.error('保存到GitHub失败:', error);
                throw error;
            }
        }

        // 加载证书数据（改进版本）
        async function loadCertData(filterText = '') {
            try {
                const tableBody = document.getElementById('certTableBody');
                if (!tableBody) {
                    throw new Error("无法找到表格元素");
                }
                
                tableBody.innerHTML = '<tr><td colspan="16" class="px-4 py-3 text-center text-sm text-gray-500"><span class="loading-spinner"></span> 加载数据中...</td></tr>';
                
                const data = await fetchFromGitHub();
                tableBody.innerHTML = '';
                
                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="16" class="px-4 py-3 text-center text-sm text-gray-500">暂无数据，首次使用需要授权初始化数据</td></tr>`;
                    const defaultData = getDefaultData();
                    openTokenModal(async () => {
                        await saveToGitHub(defaultData);
                        await loadCertData(filterText);
                    });
                    return;
                }
                
                // 过滤数据
                const filteredData = data.filter(cert => {
                    if (!filterText) return true;
                    const searchText = filterText.toLowerCase();
                    return (
                        (cert.employeeId && cert.employeeId.toLowerCase().includes(searchText)) ||
                        (cert.employeeName && cert.employeeName.toLowerCase().includes(searchText)) ||
                        (cert.certNumber && cert.certNumber.toLowerCase().includes(searchText))
                    );
                });
                
                // 填充表格
                if (filteredData.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="16" class="px-4 py-3 text-center text-sm text-gray-500">没有找到匹配的记录</td></tr>`;
                    return;
                }
                
                filteredData.forEach((cert, index) => {
                    const row = document.createElement('tr');
                    row.className = cert.isRed ? 'text-red' : '';
                    
                    row.innerHTML = `
                        <td class="px-4 py-3 text-sm text-gray-500">${index + 1}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.employeeId || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.employeeName || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.organization || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.workshop || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.line || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.certName || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.issuingAuthority || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.certNumber || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.initialDate || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.validUntil || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.reviewDate || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.workType || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.operationItem || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">${cert.actualReviewDate || ''}</td>
                        <td class="px-4 py-3 text-sm text-gray-500">
                            <button class="edit-btn mr-2 text-blue-600 hover:text-blue-800" data-id="${cert.id}">
                                <i class="fa fa-edit"></i>
                            </button>
                            <button class="delete-btn text-red-600 hover:text-red-800" data-id="${cert.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    `;
                    
                    tableBody.appendChild(row);
                });
                
                // 绑定编辑和删除按钮事件
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        editCert(id);
                    });
                });
                
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.getAttribute('data-id');
                        deleteCert(id);
                    });
                });
                
            } catch (error) {
                showError(`加载证书数据失败: ${error.message}`);
            }
        }

        // 打开证书编辑模态框
        function openCertModal() {
            document.getElementById('certModal').style.display = 'block';
            document.getElementById('modalTitle').textContent = '添加新证书';
            document.getElementById('certForm').reset();
            document.getElementById('certId').value = '';
            document.getElementById('isRed').checked = false;
        }

        // 关闭证书编辑模态框
        function closeCertModal() {
            document.getElementById('certModal').style.display = 'none';
        }

        // 编辑证书
        async function editCert(id) {
            try {
                const data = await fetchFromGitHub();
                const cert = data.find(item => item.id == id);
                
                if (!cert) {
                    throw new Error('未找到该证书记录');
                }
                
                // 填充表单
                document.getElementById('modalTitle').textContent = '编辑证书';
                document.getElementById('certId').value = cert.id;
                document.getElementById('employeeId').value = cert.employeeId || '';
                document.getElementById('employeeName').value = cert.employeeName || '';
                document.getElementById('organization').value = cert.organization || '';
                document.getElementById('workshop').value = cert.workshop || '';
                document.getElementById('line').value = cert.line || '';
                document.getElementById('certName').value = cert.certName || '';
                document.getElementById('issuingAuthority').value = cert.issuingAuthority || '';
                document.getElementById('certNumber').value = cert.certNumber || '';
                document.getElementById('initialDate').value = cert.initialDate || '';
                document.getElementById('validUntil').value = cert.validUntil || '';
                document.getElementById('reviewDate').value = cert.reviewDate || '';
                document.getElementById('workType').value = cert.workType || '';
                document.getElementById('operationItem').value = cert.operationItem || '';
                document.getElementById('actualReviewDate').value = cert.actualReviewDate || '';
                document.getElementById('isRed').checked = cert.isRed || false;
                
                document.getElementById('certModal').style.display = 'block';
            } catch (error) {
                showError(`编辑证书失败: ${error.message}`);
            }
        }

        // 删除证书
        async function deleteCert(id) {
            if (!confirm('确定要删除这条记录吗？')) {
                return;
            }
            
            try {
                const data = await fetchFromGitHub();
                const newData = data.filter(item => item.id != id);
                
                if (data.length === newData.length) {
                    throw new Error('未找到该证书记录');
                }
                
                await saveToGitHub(newData);
                const searchText = document.getElementById('searchInput').value.trim();
                await loadCertData(searchText);
            } catch (error) {
                showError(`删除失败: ${error.message}`);
            }
        }

        // 处理表单提交
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            try {
                const formData = {
                    id: document.getElementById('certId').value || Date.now(),
                    employeeId: document.getElementById('employeeId').value.trim(),
                    employeeName: document.getElementById('employeeName').value.trim(),
                    organization: document.getElementById('organization').value.trim(),
                    workshop: document.getElementById('workshop').value.trim(),
                    line: document.getElementById('line').value.trim(),
                    certName: document.getElementById('certName').value.trim(),
                    issuingAuthority: document.getElementById('issuingAuthority').value.trim(),
                    certNumber: document.getElementById('certNumber').value.trim(),
                    initialDate: document.getElementById('initialDate').value,
                    validUntil: document.getElementById('validUntil').value,
                    reviewDate: document.getElementById('reviewDate').value,
                    workType: document.getElementById('workType').value.trim(),
                    operationItem: document.getElementById('operationItem').value.trim(),
                    actualReviewDate: document.getElementById('actualReviewDate').value,
                    isRed: document.getElementById('isRed').checked
                };
                
                // 验证必填字段
                if (!formData.employeeId || !formData.employeeName || !formData.certNumber) {
                    throw new Error('员工编号、员工姓名和证书编号为必填项');
                }
                
                const data = await fetchFromGitHub();
                let newData;
                
                if (document.getElementById('certId').value) {
                    // 更新现有记录
                    newData = data.map(item => 
                        item.id == document.getElementById('certId').value ? formData : item
                    );
                } else {
                    // 添加新记录
                    newData = [...data, formData];
                }
                
                await saveToGitHub(newData);
                closeCertModal();
                
                const searchText = document.getElementById('searchInput').value.trim();
                await loadCertData(searchText);
            } catch (error) {
                showError(`保存失败: ${error.message}`);
            }
        }

        // 导出到Excel
        async function exportToExcel() {
            try {
                const data = await fetchFromGitHub();
                
                if (data.length === 0) {
                    alert('没有数据可导出');
                    return;
                }
                
                // 创建工作簿
                const wb = XLSX.utils.book_new();
                
                // 准备工作表数据
                const wsData = [
                    ['序号', '员工编号', '员工姓名', '组织', '中心站/车间', '所属线路', '证书名称', 
                     '发证机关', '证书编号', '初次领证日期', '有效期', '应复审日期', '作业类别', 
                     '操作项目', '实际复审日期', '需注意']
                ];
                
                data.forEach((cert, index) => {
                    wsData.push([
                        index + 1,
                        cert.employeeId || '',
                        cert.employeeName || '',
                        cert.organization || '',
                        cert.workshop || '',
                        cert.line || '',
                        cert.certName || '',
                        cert.issuingAuthority || '',
                        cert.certNumber || '',
                        cert.initialDate || '',
                        cert.validUntil || '',
                        cert.reviewDate || '',
                        cert.workType || '',
                        cert.operationItem || '',
                        cert.actualReviewDate || '',
                        cert.isRed ? '是' : '否'
                    ]);
                });
                
                // 创建工作表
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                
                // 将工作表添加到工作簿
                XLSX.utils.book_append_sheet(wb, ws, '高处作业证');
                
                // 生成Excel文件并下载
                XLSX.writeFile(wb, `高处作业证_${new Date().toISOString().slice(0, 10)}.xlsx`);
            } catch (error) {
                showError(`导出Excel失败: ${error.message}`);
            }
        }
    </script>
