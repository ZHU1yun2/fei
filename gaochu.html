    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;

            color: #dc2626;
            padding: 1rem;
            margin: 1rem auto;
            max-width: 6xl;

        }
    </style>
</head>

    <script>
        // 配置GitHub仓库信息
        const GITHUB_CONFIG = {
            username: 'zhu1yun2',
            repo: 'fei',
            token: null,
            filePath: 'data.json'
        };

        // 构建GitHub API URL
        const GITHUB_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/main/${GITHUB_CONFIG.filePath}`;
        const GITHUB_API_URL = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`;
        
        let pendingOperation = null;

        // 显示错误信息
        function showError(message) {
            const main = document.querySelector('main');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<strong>错误:</strong> ${message}`;
            if(main) main.prepend(errorDiv);
            else document.body.prepend(errorDiv);
            console.error(message);
            
            // 5秒后自动移除错误信息
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const tableBody = document.getElementById('certTableBody');
                if(!tableBody) throw new Error("页面缺少表格元素，请检查HTML结构");

                // 尝试从本地存储加载token
                const savedToken = localStorage.getItem('github_token');
                if(savedToken) {
                    GITHUB_CONFIG.token = savedToken;
                }

                await loadCertData();
                bindEvents();
                bindTokenEvents();
            } catch (error) {
                showError(`初始化失败: ${error.message}`);
            }
        });

        // 绑定令牌相关事件
        function bindTokenEvents() {
            document.querySelectorAll('.close, .closeTokenModal').forEach(btn => {
                btn.addEventListener('click', closeTokenModal);
            });

            document.getElementById('confirmTokenBtn').addEventListener('click', handleConfirmToken);
        }

        // 打开令牌模态框
        function openTokenModal(callback) {
            pendingOperation = callback;
            document.getElementById('tokenModal').style.display = 'block';
        }

        // 关闭令牌模态框
        function closeTokenModal() {
            document.getElementById('tokenModal').style.display = 'none';
            pendingOperation = null;
            document.getElementById('githubTokenInput').value = '';
        }

        // 处理令牌确认
        async function handleConfirmToken() {
            const token = document.getElementById('githubTokenInput').value.trim();
            if (!token) {
                alert('请输入有效的GitHub访问令牌');
                return;
            }

            // 验证令牌有效性
            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `token ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('令牌无效或权限不足');
                }

                // 保存token到本地存储
                localStorage.setItem('github_token', token);
                GITHUB_CONFIG.token = token;
                closeTokenModal();

                if (pendingOperation && typeof pendingOperation === 'function') {
                    try {
                        await pendingOperation();
                    } catch (error) {
                        showError(`操作失败: ${error.message}`);
                    }
                }
            } catch (error) {
                showError(`令牌验证失败: ${error.message}`);
            }
        }

        // 从GitHub获取数据
        async function fetchFromGitHub() {
            try {
                // 添加随机参数避免缓存
                const response = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime(), {
                    cache: 'no-cache'
                });
                
                if (!response.ok) {
                    if (response.status === 404) {
                        return [];
                    }
                    throw new Error(`GitHub请求失败: ${response.status}`);
                }

                const text = await response.text();
                if(!text.trim()) return [];
                
                try {
                    const data = JSON.parse(text);
                    return Array.isArray(data) ? data : [];
                } catch(e) {
                    throw new Error(`JSON解析失败: ${e.message}`);
                }
            } catch (error) {
                console.error('从GitHub加载数据失败:', error);
                throw error;
            }
        }

        // 保存数据到GitHub
        async function saveToGitHub(data) {
            if (!GITHUB_CONFIG.token) {
                throw new Error('需要授权才能保存数据，请输入GitHub访问令牌');
            }

            try {
                let sha = null;
                
                // 尝试获取文件SHA
                try {
                    const fileInfo = await fetch(GITHUB_API_URL, {
                        headers: {
                            'Authorization': `token ${GITHUB_CONFIG.token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    
                    if (!fileInfo.ok) {
                        const err = await fileInfo.json();
                        throw new Error(`获取文件信息失败: ${fileInfo.status} - ${err.message || '令牌权限不足'}`);
                    }
                    
                    const fileData = await fileInfo.json();
                    sha = fileData.sha;
                } catch (e) {
                    console.log("首次创建文件，不需要SHA");
                }

                // 准备数据
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
                
                // 发送更新请求
                const response = await fetch(GITHUB_API_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `更新高处作业证数据 - ${new Date().toLocaleString()}`,
                        content: content,
                        sha: sha
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(`GitHub保存失败: ${response.status} - ${err.message || '令牌权限不足'}`);
                }

                return true;
            } catch (error) {
                console.error('保存到GitHub失败:', error);
                throw error;
            }
        }

        // 加载证书数据
        async function loadCertData(filterText = '') {
            try {
                const data = await fetchFromGitHub();
                const tableBody = document.getElementById('certTableBody');
                tableBody.innerHTML = '';

                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="16" class="px-4 py-3 text-center text-sm text-gray-500">暂无数据，首次使用需要授权初始化数据</td></tr>`;
                    const defaultData = getDefaultData();
                    openTokenModal(async () => {
                        await saveToGitHub(defaultData);
                        await loadCertData(filterText);
                    });
                    return;
                }

                // 过滤数据
                const filteredData = data.filter(cert => {
                    if (!filterText) return true;
                    const searchText = filterText.toLowerCase();
                    return (
                        (cert.employeeId && cert.employeeId.toLowerCase().includes(searchText)) ||
                        (cert.employeeName && cert.employeeName.toLowerCase().includes(searchText)) ||
                        (cert.certNumber && cert.certNumber.toLowerCase().includes(searchText))
                    );
                });

                // 填充表格
                filteredData.forEach((cert, index) => {
                    const row = document.createElement('tr');
                    const textClass = cert.isRed ? 'text-red' : 'text-gray-900';
                    
                    // 格式化日期显示
                    const formatDate = (dateStr) => {
                        if (!dateStr) return '';
                        // 尝试解析不同格式的日期
                        const date = new Date(dateStr);
                        if (isNaN(date.getTime())) return dateStr; // 如果无法解析，返回原始字符串
                        return date.toISOString().split('T')[0]; // 格式化为YYYY-MM-DD
                    };

                    row.innerHTML = `
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${index + 1}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.employeeId || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.employeeName || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.organization || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.workshop || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.line || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.certName || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.issuingAuthority || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.certNumber || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.initialDate)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.validUntil)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.reviewDate)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.workType || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${cert.operationItem || ''}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm ${textClass} table-data">${formatDate(cert.actualReviewDate)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900 table-data">
                            <button class="edit-btn mr-2 text-blue-600 hover:text-blue-800" data-id="${cert.id}">
                                <i class="fa fa-edit"></i>
                            </button>
                            <button class="delete-btn text-red-600 hover:text-red-800" data-id="${cert.id}">
                                <i class="fa fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                bindEditDeleteEvents();
            } catch (error) {
                showError('加载数据失败: ' + error.message);
            }
        }

        // 绑定事件
        function bindEvents() {
            document.getElementById('addBtn').addEventListener('click', function() {
                openModal('add');
            });

            document.getElementById('refreshBtn').addEventListener('click', function() {
                loadCertData();
                document.getElementById('searchInput').value = '';
            });

            document.getElementById('searchBtn').addEventListener('click', function() {
                const searchText = document.getElementById('searchInput').value.trim();
                loadCertData(searchText);
            });

            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchText = this.value.trim();
                    loadCertData(searchText);
                }
            });

            document.getElementById('exportExcel').addEventListener('click', exportToExcel);

            document.querySelectorAll('.close, .closeModal').forEach(btn => {
                btn.addEventListener('click', closeModal);
            });

            document.getElementById('certForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!GITHUB_CONFIG.token) {
                    openTokenModal(async () => {
                        await saveCert();
                    });
                } else {
                    await saveCert();
                }
            });
        }

        // 绑定编辑和删除按钮事件
        function bindEditDeleteEvents() {
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    openModal('edit', id);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    if (confirm('确定要删除这条记录吗？')) {
                        if (!GITHUB_CONFIG.token) {
                            openTokenModal(async () => {
                                await deleteCert(id);
                            });
                        } else {
                            deleteCert(id);
                        }
                    }
                });
            });
        }

        // 打开编辑/添加模态框
        async function openModal(mode, id = null) {
            const modal = document.getElementById('certModal');
            const form = document.getElementById('certForm');
            const title = document.getElementById('modalTitle');

            if (mode === 'add') {
                title.textContent = '添加新证书';
                form.reset();
                document.getElementById('certId').value = '';
            } else if (mode === 'edit' && id) {
                title.textContent = '编辑证书信息';
                try {
                    const data = await fetchFromGitHub();
                    const cert = data.find(item => item.id === id);
                    if (cert) {
                        Object.keys(cert).forEach(key => {
                            const field = document.getElementById(key);
                            if (field) {
                                if (field.type === 'checkbox') {
                                    field.checked = cert[key];
                                } else {
                                    // 处理日期字段
                                    if (field.type === 'date' && cert[key]) {
                                        // 尝试解析不同格式的日期
                                        const date = new Date(cert[key]);
                                        if (!isNaN(date.getTime())) {
                                            field.value = date.toISOString().split('T')[0];
                                        } else {
                                            field.value = cert[key] || '';
                                        }
                                    } else {
                                        field.value = cert[key] || '';
                                    }
                                }
                            }
                        });
                        document.getElementById('certId').value = id;
                    }
                } catch (error) {
                    showError("加载编辑数据失败: " + error.message);
                }
            }
            modal.style.display = 'block';
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('certModal').style.display = 'none';
        }

        // 保存证书
        async function saveCert() {
            try {
                const id = document.getElementById('certId').value;
                const isRed = document.getElementById('isRed').checked;

                const certData = {
                    employeeId: document.getElementById('employeeId').value,
                    employeeName: document.getElementById('employeeName').value,
                    organization: document.getElementById('organization').value,
                    workshop: document.getElementById('workshop').value,
                    line: document.getElementById('line').value,
                    certName: document.getElementById('certName').value,
                    issuingAuthority: document.getElementById('issuingAuthority').value,
                    certNumber: document.getElementById('certNumber').value,
                    initialDate: document.getElementById('initialDate').value,
                    validUntil: document.getElementById('validUntil').value,
                    reviewDate: document.getElementById('reviewDate').value,
                    workType: document.getElementById('workType').value,
                    operationItem: document.getElementById('operationItem').value,
                    actualReviewDate: document.getElementById('actualReviewDate').value,
                    isRed: isRed
                };

                let data = await fetchFromGitHub();
                
                if (id) {
                    // 更新现有记录
                    const index = data.findIndex(item => item.id === parseInt(id));
                    if (index !== -1) {
                        data[index] = { ...data[index], ...certData };
                    }
                } else {
                    // 添加新记录
                    const newId = data.length > 0 ? Math.max(...data.map(item => item.id)) + 1 : 1;
                    data.push({ id: newId, ...certData });
                }

                await saveToGitHub(data);
                await loadCertData();
                closeModal();
            } catch (error) {
                console.error('保存证书失败:', error);
                showError('保存失败: ' + error.message);
            }
        }

        // 删除证书
        async function deleteCert(id) {
            try {
                let data = await fetchFromGitHub();
                data = data.filter(item => item.id !== id);
                await saveToGitHub(data);
                await loadCertData();
            } catch (error) {
                console.error('删除证书失败:', error);
                showError('删除失败: ' + error.message);
            }
        }

        // 导出到Excel
        async function exportToExcel() {
            try {
                const data = await fetchFromGitHub();
                if (data.length === 0) {
                    alert('没有可导出的数据');
                    return;
                }

                const processedData = data.map(item => {
                    const newItem = {};
                    const fieldMap = {
                        employeeId: '员工编号',
                        employeeName: '员工姓名',
                        organization: '组织',
                        workshop: '中心站/车间',
                        line: '所属线路',
                        certName: '证书名称',
                        issuingAuthority: '发证机关',
                        certNumber: '证书编号',
                        initialDate: '初次领证日期',
                        validUntil: '有效期',
                        reviewDate: '应复审日期',
                        workType: '作业类别',
                        operationItem: '操作项目',
                        actualReviewDate: '实际复审日期'
                    };

                    Object.keys(fieldMap).forEach(key => {
                        newItem[fieldMap[key]] = item[key] || '';
                    });

                    return newItem;
                });

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(processedData);
                ws['!cols'] = [
                    {wch: 10}, {wch: 15}, {wch: 10},
                    {wch: 20}, {wch: 15}, {wch: 10},
                    {wch: 20}, {wch: 20}, {wch: 25},
                    {wch: 15}, {wch: 15}, {wch: 15},
                    {wch: 15}, {wch: 25}
                ];

                XLSX.utils.book_append_sheet(wb, ws, "高处作业证数据");
                XLSX.writeFile(wb, `高处作业证_${new Date().toLocaleDateString()}.xlsx`);
            } catch (error) {
                console.error('导出Excel失败:', error);
                showError('导出失败: ' + error.message);
            }
        }
    </script>
